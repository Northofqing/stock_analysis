# Manual descriptive review registry. Versions below label review assumptions,
# not deployed strategy releases, DB schema authority, or activation inputs.
schema_version = 1
registry_version = "signal-registry-v0"

[[signals]]
id = "news_catalyst"
name = "NewsCatalyst"
signal_version = "news-catalyst-review-v0"
exit_version = "existing-paper-exits-review-v0"
cost_version = "lot-rates-v1"
action = "observe"
status = "evidence_pending"
entry_assumptions = "Original admitted news candidate and entry identity must be independently joined; no entry is inferred from reason text."
windows = [1, 3, 5]
eligibility = "Requires original typed family/version identity, qualified session and price evidence, and mature windows; currently no reliable join in weekly readers."

