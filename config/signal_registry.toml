# Manual descriptive review registry. Versions below label review assumptions,
# not deployed strategy releases, DB schema authority, or activation inputs.
# action/status and source_module are declared review metadata, not a change to
# current monitor settings or an assertion that a sample is qualified.
schema_version = 1
registry_version = "signal-registry-v0"

[[signal]]
id = "news_catalyst"
name = "NewsCatalyst"
signal_version = "news-catalyst-review-v0"
exit_rule_version = "existing-paper-exits-review-v0"
cost_model_version = "lot-rates-v1"
source_module = "monitor.news_aggregator_init"
action = "info_only"
status = "watch"
entry_assumption = "Original admitted news candidate and entry identity must be independently joined; no entry is inferred from reason text."
observation_window = ["t1", "t3", "t5"]

eligibility_price_observation = "Requires mature revalidated closes and independent session evidence; original typed family/signal-version join missing. Historical PIT authority remains unavailable."
eligibility_simulated_fill = "Requires original typed family/signal-version join and a valid effective paper capability with qualified simulated fill prices; no qualification inferred from reason text."
eligibility_net_return = "Requires family/signal/exit-rule/cost-model lineage, qualified fill prices, complete costs and dependent FIFO batches; unresolved disputes remain unavailable."

