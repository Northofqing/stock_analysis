name: Rust CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check architecture documents
        run: ruby scripts/architecture-docs/check.rb --check

      # Keep the compiler identical to the BR-252 coverage/release identity.
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config protobuf-compiler libfontconfig1-dev libfreetype6-dev libssl-dev libsqlite3-dev libpam0g-dev ripgrep

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Strict Clippy (all targets/features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all targets/features)
        run: cargo test --all-targets --all-features --verbose
