[package]
name = "stock_analysis"
version = "0.1.2"
edition = "2021"
default-run = "stock_analysis"

[lib]
name = "stock_analysis"
path = "src/lib.rs"

[[bin]]
name = "stock_analysis"
path = "src/main.rs"

[[bin]]
name = "lhb_query"
path = "src/bin/lhb_query.rs"

[[bin]]
name = "rsi_optimize"
path = "src/bin/rsi_optimize.rs"

[[bin]]
name = "winrate_simulator"
path = "src/bin/winrate_simulator.rs"

[dependencies]
tokio = { version = "1.49.0", features = ["full", "rt"] }
anyhow = "1.0.100"
dotenvy = "0.15.7"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"  # 修复 P1-1: event_id 用 sha256
hex = "0.4"     # 修复 P1-1: event_id hex 编码
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
prometheus = "0.13" # v16.6 #2: 监控 metrics 暴露 :9090/metrics
log = "0.4"
env_logger = "0.11"
url = "2.5"
async-trait = "0.1"
once_cell = "1.19"
regex = "1.10"
lazy_static = "1.4"
diesel = { version = "2.3.5", features = ["sqlite", "r2d2", "chrono"] }
rusqlite = { version = "0.31", features = ["chrono", "functions"] }
lettre = { version = "0.11.19", features = ["smtp-transport", "sendmail-transport", "builder", "tokio1-native-tls"] }
clap = { version = "4.5.54", features = ["derive"] }
# BR-164: every public market/news provider is resolved from one immutable
# upstream release commit. Do not mix path/crates.io/Git revisions.
# M5 (Task #76): 全部 optional, 归入 magic-gateway feature (默认开)。
# monitor 生产构建 --no-default-features = 零 magic-* 运行时 (数据全走 gRPC);
# grpc_market_server 是数据提供者宿主, 构建 --features magic-gateway (默认即含)。
magic-tdx-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-market-core = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-market-router = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-market-composition = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-eastmoney-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-ths-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-sina-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-cninfo-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-tencent-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-cls-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-jin10-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-thepaper-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-exchange-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
magic-baidu-rs = { git = "https://github.com/Northofqing/magic-market-data-rs.git", rev = "75ee2a2bdd3b1ca2b01ce3afbb04aec416e7000e", version = "=0.2.0", optional = true }
plotters = "0.3"
futures = "0.3"
fs2 = "0.4.3"
polars = { version = "0.54", features = ["lazy", "round_series", "cum_agg", "rolling_window", "strings"] }
thiserror = "2.0.18"
async-openai = "0.19.0"
toml = "0.8"
arc-swap = "1.9.2"
dashmap = "6.2.1"
aho-corasick = "1.1.4"
# CR-AUTH: CLI operator 密码认证
rpassword = "7"        # 隐藏式密码输入
whoami = "1"          # 当前 Unix 用户 fallback
zeroize = "1"         # 密码 buffer 擦除
# grpc 数据通道 (docs/superpowers/plans/2026-08-13-grpc-data-channel.md Task 1):
# 唯一合同源 grpc/market.proto, 由 build.rs + tonic-prost-build 生成代码, 本文件不改 proto
# tonic 0.14 拆分: tonic-prost (codec 运行时, 生成代码引用 tonic_prost::ProstCodec)
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = "0.1"

[features]
# M5 (Task #76): 默认开 → 既有构建/测试行为不变 (全量 magic-*)。
# monitor 生产构建: cargo build --release --bin monitor --no-default-features
#   = 零 magic-* 编译与运行时 (数据全走 gRPC 桥, DATA_GATEWAY_GRPC=1)。
# grpc_market_server 构建: 默认 (含 magic-gateway) = 数据提供者宿主。
# 回滚: git revert (编译期依赖, 非运行时开关)。
default = ["magic-gateway"]
magic-gateway = [
    "dep:magic-tdx-rs",
    "dep:magic-market-core",
    "dep:magic-market-router",
    "dep:magic-market-composition",
    "dep:magic-eastmoney-rs",
    "dep:magic-ths-rs",
    "dep:magic-sina-rs",
    "dep:magic-cninfo-rs",
    "dep:magic-tencent-rs",
    "dep:magic-cls-rs",
    "dep:magic-jin10-rs",
    "dep:magic-thepaper-rs",
    "dep:magic-exchange-rs",
    "dep:magic-baidu-rs",
]

[build-dependencies]
# tonic 0.14 重构: configure()/compile() 移入 tonic-prost-build
# (tonic-build 0.14 只保留 Service codegen; tonic-prost-build 传递依赖 tonic-build)
tonic-prost-build = "0.14"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
pam = "0.7"           # PAM 跨平台认证 (Linux/macOS, 用 0.7 因 0.8 与 rustc 1.97+ 编译失败)

# v20.2: race condition 彻底解决 (test_design_contradiction 跨 test binary 文件 race)
# serial_test 0.10+ 用 process-wide mutex (std Mutex 跨 test binary 不可见)
[dev-dependencies]
serial_test = "0.10"
criterion = { version = "0.5", features = ["html_reports"] } # v16.8 #1: benchmark 套件
reqwest_011 = { package = "reqwest", version = "0.11.27", default-features = false }

# The monitor has many integration-test binaries and upstream provider crates.
# Full debuginfo plus incremental caches previously expanded `target/` beyond
# 18 GiB and exhausted the build volume. Keep line tables for useful traces,
# but make local Gate B/C rebuilds bounded and reproducible.
[profile.dev]
debug = 1
incremental = false

[profile.test]
# The full suite links every auto-discovered utility binary. Keeping DWARF
# line tables for each duplicate test harness exhausts the live monitor host's
# build volume before tests can start; test failures still retain Rust
# backtraces and symbols at debug=0.
debug = 0
incremental = false
